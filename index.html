        let activeBtnElement = null;
        let isTimerActive = false;
        let countdownTimer = null;

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('previewImg');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxSize = 200;
                        
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        preview.src = compressedImageBase64;
                        preview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                compressedImageBase64 = "";
                preview.style.display = 'none';
            }
        }

        async function loadGroups() {
            const { data, error } = await _supabase
                .from('groups')
                .select('*');

            if (error) {
                console.error('Erreur Supabase :', error);
                document.getElementById('groupGrid').innerHTML = '<div style="text-align:center; color:var(--danger-color); padding:30px 20px;">Erreur de connexion avec la base de données.</div>';
                return;
            }

            allGroups = data || [];
            renderPopularSection();
            filterAndRender();
        }

        function getSortedGroups() {
            return [...allGroups].sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
        }

        function renderPopularSection() {
            const section = document.getElementById('popularSection');
            const carousel = document.getElementById('popularCarousel');

            const popularGroups = getSortedGroups().slice(0, 5);

            if (popularGroups.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            carousel.innerHTML = '';

            popularGroups.forEach((group, index) => {
                const imageSrc = (group.image && typeof group.image === 'string' && group.image.trim() !== '') 
                    ? group.image 
                    : '';

                const avatarHtml = imageSrc 
                    ? `<img src="${imageSrc}" class="popular-avatar" alt="${group.name}">`
                    : `<div class="popular-avatar"><i class="fa-solid fa-users"></i></div>`;

                const clicksCount = group.clicks || 0;
                const isTop1 = (index === 0 && clicksCount > 0);
                const rankClass = isTop1 ? 'rank-1' : (index < 3 ? 'rank-top' : '');
                const badgeClass = isTop1 ? 'rank-badge top-1' : 'rank-badge';
                const badgeLabel = isTop1 ? '👑 N°1' : `#${index + 1}`;
                const safeName = group.name.replace(/'/g, "\'");

                const cardHtml = `
                    <div class="popular-card ${rankClass}">
                        <span class="${badgeClass}">${badgeLabel}</span>
                        <div>
                            <div class="popular-header">
                                ${avatarHtml}
                                <div>
                                    <div class="popular-title">${group.name}</div>
                                    <div class="popular-clicks"><i class="fa-solid fa-eye"></i> ${clicksCount} vue${clicksCount > 1 ? 's' : ''}</div>
                                </div>
                            </div>
                        </div>
                        <button onclick="handleJoinClick(this, '${group.id}', '${safeName}', '${group.link || '#'}')" class="join-btn" style="padding: 6px; font-size: 0.8rem; margin-top: 6px;">
                            <i class="fa-brands fa-whatsapp"></i> Rejoindre
                        </button>
                    </div>
                `;
                carousel.innerHTML += cardHtml;
            });
        }

        async function trackClick(groupId) {
            const group = allGroups.find(g => g.id == groupId);
            if (!group) return;

            const newClicks = (group.clicks || 0) + 1;
            group.clicks = newClicks;

            await _supabase
                .from('groups')
                .update({ clicks: newClicks })
                .eq('id', groupId);
            
            renderPopularSection();
            filterAndRender();
        }

        function handleJoinClick(btnElement, id, name, link) {
            if (isTimerActive) {
                triggerAdRedirect();
                return;
            }

            activeGroupId = id;
            activeGroupLink = link;
            activeBtnElement = btnElement;

            btnElement.classList.add('loading');
            btnElement.innerHTML = `<span class="spinner"></span> Chargement...`;
            isTimerActive = true;

            document.getElementById('targetGroupName').textContent = name;
            document.getElementById('modalTimerBadge').innerHTML = `<span class="spinner"></span> Chargement (2s)...`;
            
            const btnFinal = document.getElementById('btnFinalJoin');
            btnFinal.disabled = true;
            document.getElementById('joinModal').style.display = 'flex';

            const startTime = Date.now();

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const left = Math.max(0, Math.ceil((2000 - elapsed) / 1000));

                if (left > 0) {
                    btnElement.innerHTML = `<span class="spinner"></span> Patientez ${left}s...`;
                    document.getElementById('modalTimerBadge').innerHTML = `<span class="spinner"></span> Patientez ${left}s...`;
                } else {
                    clearInterval(countdownTimer);
                    isTimerActive = false;

                    btnElement.classList.remove('loading');
                    btnElement.classList.add('ready');
                    btnElement.innerHTML = `<i class="fa-solid fa-circle-check"></i> Accéder`;

                    document.getElementById('modalTimerBadge').style.borderColor = 'var(--accent-green)';
                    document.getElementById('modalTimerBadge').style.color = 'var(--accent-green)';
                    document.getElementById('modalTimerBadge').innerHTML = `<i class="fa-solid fa-circle-check"></i> Prêt !`;
                    
                    btnFinal.disabled = false;
                }
            }, 100);
        }

        function triggerAdRedirect() {
            if (ADSTERRA_SMARTLINK && !ADSTERRA_SMARTLINK.includes('YOUR_DIRECT_LINK_HERE')) {
                window.open(ADSTERRA_SMARTLINK, '_blank');
            }
        }

        function executeFinalJoin() {
            if (activeGroupId) {
                trackClick(activeGroupId);
            }
            if (activeGroupLink) {
                window.open(activeGroupLink, '_blank');
            }
            closeModal('joinModal');
            resetBtnState();
        }

        function cancelJoinModal() {
            if (countdownTimer) clearInterval(countdownTimer);
            isTimerActive = false;
            closeModal('joinModal');
            resetBtnState();
        }

        function resetBtnState() {
            if (activeBtnElement) {
                activeBtnElement.classList.remove('loading', 'ready');
                activeBtnElement.innerHTML = `<i class="fa-brands fa-whatsapp"></i> Rejoindre`;
            }
        }

        function setCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterAndRender();
        }

        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allGroups.filter(g => {
                const matchesCategory = (currentCategory === 'Tous') || 
                                        (g.category && g.category.toLowerCase() === currentCategory.toLowerCase());
                
                const matchesSearch = (g.name && g.name.toLowerCase().includes(query)) ||
                                      (g.category && g.category.toLowerCase().includes(query)) ||
                                      (g.description && g.description.toLowerCase().includes(query));

                return matchesCategory && matchesSearch;
            });

            renderGroups(filtered);
        }

        function renderGroups(groups) {
            const container = document.getElementById('groupGrid');
            container.innerHTML = '';

            if (groups.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px 20px;">Aucun groupe ne correspond à votre recherche.</div>';
                return;
            }

            const sortedAll = getSortedGroups();
            const top1Id = (sortedAll.length > 0 && (sortedAll[0].clicks || 0) > 0) ? sortedAll[0].id : null;
            const top3Ids = sortedAll.slice(0, 3).filter(g => (g.clicks || 0) > 0).map(g => g.id);

            groups.forEach(group => {
                const card = document.createElement('div');
                const isTop1 = (group.id == top1Id);
                const isTop3 = top3Ids.includes(group.id);

                card.className = `group-card ${isTop1 ? 'gold-border' : ''}`;

                const imageSrc = (group.image && typeof group.image === 'string' && group.image.trim() !== '') 
                    ? group.image 
                    : '';

                const avatarHtml = imageSrc 
                    ? `<img src="${imageSrc}" class="group-avatar" alt="${group.name}">`
                    : `<div class="group-avatar"><i class="fa-solid fa-users" style="font-size: 1.2rem;"></i></div>`;

                let badgeHtml = '';
                if (isTop1) {
                    badgeHtml = `<span class="badge-trend badge-number-one"><i class="fa-solid fa-crown"></i> 👑 N°1 Tendance</span>`;
                } else if (isTop3) {
                    badgeHtml = `<span class="badge-trend badge-top-three"><i class="fa-solid fa-fire"></i> 🔥 Tendance</span>`;
                }

                const safeName = group.name.replace(/'/g, "\'");

                card.innerHTML = `
                    <div class="group-header">
                        ${avatarHtml}
                        <div>
                            <div class="group-title">${group.name}</div>
                            <div class="group-category-container">
                                <span class="group-category">${group.category || 'Général'}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                    </div>
                    <div class="group-desc">${group.description || 'Aucune description.'}</div>
                    <div class="card-actions">
                        <button onclick="handleJoinClick(this, '${group.id}', '${safeName}', '${group.link || '#'}')" class="join-btn">
                            <i class="fa-brands fa-whatsapp" style="font-size: 1.1rem;"></i> Rejoindre
                        </button>
                        <button class="share-btn-icon" onclick="openGroupShareModal('${safeName}', '${group.link || '#'}')">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openCommunityShareModal() {
            activeShareText = `👋 Tu cherches de nouveaux groupes WhatsApp à rejoindre ?
Anime, gaming, business, études et bien d'autres communautés t'attendent sur BLATZ ! 🔥
Explore les catégories, découvre les groupes et choisis ceux qui t'intéressent.

🔗 https://devnas2.github.io/BLATZ-/`;

            document.getElementById('shareModalTitle').textContent = "Agrandir la communauté";
            document.getElementById('shareModalImg').style.display = "block";
            document.getElementById('shareModalPreviewText').textContent = activeShareText;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function openGroupShareModal(name, link) {
            activeShareText = `🔥 Rejoins le groupe "${name}" sur BLAZT !
Découvre des centaines de communautés WhatsApp passionnantes.

🔗 Lien direct du groupe : ${link}
🌐 Découvre l'annuaire : https://devnas2.github.io/BLATZ-/`;

            document.getElementById('shareModalTitle').textContent = `Partager "${name}"`;
            document.getElementById('shareModalImg').style.display = "none";
            document.getElementById('shareModalPreviewText').textContent = activeShareText;
            document.getElementById('shareModal').style.display = 'flex';
        }

        function executeWaShare() {
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(activeShareText)}`;
            window.open(url, '_blank');
        }

        function executeCopyShare() {
            navigator.clipboard.writeText(activeShareText).then(() => {
                alert("Message et lien copiés dans le presse-papier !");
            });
        }

        function openModal() {
            document.getElementById('groupForm').style.display = 'block';
            document.getElementById('successAdContainer').style.display = 'none';
            document.getElementById('modalTitle').textContent = "Ajouter un lien WhatsApp";
            document.getElementById('addGroupModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        async function addNewGroup() {
            const name = document.getElementById('groupName').value.trim();
            const category = document.getElementById('groupCategory').value;
            const link = document.getElementById('groupLink').value.trim();
            const description = document.getElementById('groupDesc').value.trim();

            if (!name || !link || !description) {
                alert("Veuillez remplir tous les champs obligatoires (Nom, Lien, Description).");
                return;
            }

            const newRecord = {
                id: Date.now(),
                name: name,
                category: category,
                link: link,
                description: description,
                image: compressedImageBase64,
                clicks: 0
            };

            const btn = document.getElementById('btnPublish');
            btn.textContent = "Publication...";
            btn.disabled = true;

            const { error } = await _supabase
                .from('groups')
                .insert([newRecord]);

            btn.textContent = "Publier";
            btn.disabled = false;

            if (error) {
                alert("Erreur lors de la publication : " + error.message);
                return;
            }

            document.getElementById('groupName').value = '';
            document.getElementById('groupLink').value = '';
            document.getElementById('groupDesc').value = '';
            document.getElementById('groupImageFile').value = '';
            document.getElementById('previewImg').style.display = 'none';
            compressedImageBase64 = "";

            document.getElementById('groupForm').style.display = 'none';
            document.getElementById('successAdContainer').style.display = 'block';
            document.getElementById('modalTitle').textContent = "Succès !";

            loadGroups();
        }

        window.onload = () => {
            loadGroups();
        };
    </script>
</body>
</html>
