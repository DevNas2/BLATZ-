<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLAZT - Annuaire de Groupes & Chaînes WhatsApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: #111827;
            --accent-green: #25d366;
            --accent-blue: #00f2fe;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, #111827 0%, #080b11 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 15px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-green);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* BOUTON AJOUTER UN LIEN */
        .add-group-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px auto 0 auto;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        /* EMPLACEMENT PUBLICITAIRE */
        .ad-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            padding: 8px;
            background: var(--card-bg);
            border: 1px dashed #374151;
            border-radius: 8px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* RECHERCHE & FILTRES */
        .controls {
            width: 100%;
            max-width: 500px;
            margin: 15px auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-green);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-green);
        }

        /* GRILLE MOBILE */
        .group-grid {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .group-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            position: relative;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .group-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 2px solid var(--accent-green);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .group-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .group-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .group-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .join-btn {
            background: var(--accent-green);
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 11px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* MODALE (FORMULAIRE) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
            border-radius: 14px;
            padding: 20px;
            position: relative;
            margin: auto;
        }

        .modal-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        /* ZONE OPTIMISÉE POUR L'IMAGE */
        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-color);
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        .file-upload-box input[type="file"] {
            border: none;
            padding: 0;
            background: transparent;
        }

        .image-preview {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #1f2937;
            object-fit: cover;
            display: none;
            border: 1px solid var(--accent-green);
        }

        .submit-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">BLA<span>ZT</span></div>
        <div class="tagline">Rejoins et partage tes liens WhatsApp</div>
        <button class="add-group-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Ajouter un lien
        </button>
    </header>

    <!-- PUBLICITÉ -->
    <div class="ad-container">
        <span>[ Emplacement Publicitaire / Bannière ]</span>
    </div>

    <!-- RECHERCHE & FILTRES -->
    <div class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filterGroups()">
        </div>
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('all', this)">Tous</button>
            <button class="cat-btn" onclick="filterCategory('Communauté', this)">Communauté</button>
            <button class="cat-btn" onclick="filterCategory('Groupe', this)">Groupe</button>
            <button class="cat-btn" onclick="filterCategory('Chaîne', this)">Chaîne</button>
        </div>
    </div>

    <!-- GRILLE DE CARTES -->
    <div class="group-grid" id="groupGrid"></div>

    <!-- MODALE -->
    <div class="modal" id="addGroupModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Ajouter un lien WhatsApp</span>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div id="groupForm">
                <div class="form-group">
                    <label>Nom du groupe / chaîne</label>
                    <input type="text" id="groupName" placeholder="Ex: Actualités Tech 2026">
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="groupCategory">
                        <option value="Communauté">Communauté</option>
                        <option value="Groupe">Groupe</option>
                        <option value="Chaîne">Chaîne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lien d'invitation WhatsApp</label>
                    <input type="url" id="groupLink" placeholder="https://chat.whatsapp.com/...">
                </div>
                <div class="form-group">
                    <label>Image de profil (Optionnel)</label>
                    <div class="file-upload-box">
                        <input type="file" id="groupImageFile" accept="image/*" onchange="previewSelectedImage(event)">
                        <img id="previewImg" class="image-preview" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="groupDesc" rows="3" placeholder="De quoi s'agit-il ?"></textarea>
                </div>
                <button type="button" class="submit-btn" id="btnPublish" onclick="addNewGroup()">Publier</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 BLAZT. Tous droits réservés.</p>
    </footer>

    <script>
        let whatsappGroups = JSON.parse(localStorage.getItem('blazt_groups')) || [];
        let myCreatedIds = JSON.parse(localStorage.getItem('blazt_my_ids')) || [];
        let compressedImageBase64 = "";

        // APERÇU + COMPRESSION D'IMAGE AUTOMATIQUE (MAX 200x200 px)
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('previewImg');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxSize = 200;
                        
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        preview.src = compressedImageBase64;
                        preview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                compressedImageBase64 = "";
                preview.style.display = 'none';
            }
        }

        // AFFICHAGE DES GROUPES
        function renderGroups(groups) {
            const container = document.getElementById('groupGrid');
            container.innerHTML = '';

            if (groups.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px 20px;">Aucun groupe pour le moment. Cliquez sur "Ajouter un lien" pour en publier un !</div>';
                return;
            }

            groups.forEach(group => {
                const card = document.createElement('div');
                card.className = 'group-card';

                const avatarHtml = group.image && group.image.trim() !== ""
                    ? `<img src="${group.image}" class="group-avatar" alt="${group.name}">`
                    : `<div class="group-avatar"><i class="fa-solid fa-users" style="font-size: 1.2rem;"></i></div>`;

                const canDelete = myCreatedIds.includes(group.id);
                const deleteBtnHtml = canDelete 
                    ? `<button class="delete-btn" onclick="deleteGroup('${group.id}')"><i class="fa-solid fa-trash"></i> Supprimer</button>` 
                    : '';

                card.innerHTML = `
                    ${deleteBtnHtml}
                    <div class="group-header">
                        ${avatarHtml}
                        <div>
                            <div class="group-title">${group.name}</div>
                            <div class="group-category">${group.category}</div>
                        </div>
                    </div>
                    <div class="group-desc">${group.description}</div>
                    <a href="${group.link}" target="_blank" class="join-btn">
                        <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> Rejoindre
                    </a>
                `;
                container.appendChild(card);
            });
        }

        function openModal() {
            document.getElementById('addGroupModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addGroupModal').style.display = 'none';
        }

        // PUBLICATION SÉCURISÉE
        function addNewGroup() {
            const name = document.getElementById('groupName').value.trim();
            const category = document.getElementById('groupCategory').value;
            const link = document.getElementById('groupLink').value.trim();
            const description = document.getElementById('groupDesc').value.trim();

            if (!name || !link || !description) {
                alert("Veuillez remplir tous les champs obligatoires (Nom, Lien et Description).");
                return;
            }

            const uniqueId = 'group_' + Date.now();
            const newGroup = { 
                id: uniqueId, 
                name, 
                category, 
                link, 
                description, 
                image: compressedImageBase64 
            };
            
            whatsappGroups.unshift(newGroup);
            myCreatedIds.push(uniqueId);

            localStorage.setItem('blazt_groups', JSON.stringify(whatsappGroups));
            localStorage.setItem('blazt_my_ids', JSON.stringify(myCreatedIds));

            renderGroups(whatsappGroups);
            
            // Réinitialisation
            document.getElementById('groupName').value = '';
            document.getElementById('groupLink').value = '';
            document.getElementById('groupDesc').value = '';
            document.getElementById('groupImageFile').value = '';
            document.getElementById('previewImg').style.display = 'none';
            compressedImageBase64 = "";
            closeModal();
        }

        function deleteGroup(id) {
            if (confirm("Voulez-vous vraiment supprimer ce lien ?")) {
                whatsappGroups = whatsappGroups.filter(g => g.id !== id);
                myCreatedIds = myCreatedIds.filter(itemId => itemId !== id);

                localStorage.setItem('blazt_groups', JSON.stringify(whatsappGroups));
                localStorage.setItem('blazt_my_ids', JSON.stringify(myCreatedIds));

                renderGroups(whatsappGroups);
            }
        }

        function filterGroups() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = whatsappGroups.filter(g => 
                g.name.toLowerCase().includes(query) || 
                g.description.toLowerCase().includes(query)
            );
            renderGroups(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'all') {
                renderGroups(whatsappGroups);
            } else {
                const filtered = whatsappGroups.filter(g => g.category === cat);
                renderGroups(filtered);
            }
        }

        window.onload = () => {
            renderGroups(whatsappGroups);
        };
    </script>
</body>
</html>
