<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLAZT - Annuaire de Groupes & Chaînes WhatsApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #080b11;
            --card-bg: #111827;
            --accent-green: #25d366;
            --accent-blue: #00f2fe;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
            --danger-color: #ef4444;
            --badge-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, #111827 0%, #080b11 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 15px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-green);
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .add-group-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 15px auto 0 auto;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        /* BANNIÈRE PUBS */
        .ad-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* SECTION POPULAIRES (CARROUSEL) */
        .popular-section {
            width: 100%;
            max-width: 500px;
            margin: 15px auto 10px auto;
            padding: 0 12px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--badge-gold);
        }

        .popular-carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .popular-carousel::-webkit-scrollbar {
            display: none;
        }

        .popular-card {
            min-width: 200px;
            max-width: 220px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .rank-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--badge-gold);
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .popular-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .popular-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 1px solid var(--accent-green);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .popular-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .popular-clicks {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* RECHERCHE ET FILTRES */
        .controls {
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-green);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-green);
        }

        /* GRILLE DE CARTES PRINCIPALE */
        .group-grid {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .group-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            position: relative;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .group-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #1f2937;
            border: 2px solid var(--accent-green);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
        }

        .group-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .group-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .group-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.4;
            word-break: break-word;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .join-btn {
            background: var(--accent-green);
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
            cursor: pointer;
        }

        /* MODAL DE SOUMISSION */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 450px;
            border-radius: 14px;
            padding: 20px;
            position: relative;
            margin: auto;
        }

        .modal-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-color);
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        .image-preview {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #1f2937;
            object-fit: cover;
            display: none;
            border: 1px solid var(--accent-green);
        }

        .submit-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">BLA<span>ZT</span></div>
        <div class="tagline">Rejoins et partage tes liens WhatsApp</div>
        <button class="add-group-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Ajouter un lien
        </button>
    </header>

    <!-- EMPLACEMENT PUBLICITAIRE PRINCIPAL (Bannière 320x50 AdStrea) -->
    <div class="ad-container">
        <script>
          atOptions = {
            'key' : '76f5803619b67c0e9bdbaf47aec52a69',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/76f5803619b67c0e9bdbaf47aec52a69"></script>
    </div>

    <!-- SECTION GROUPES POPULAIRES (CARROUSEL) -->
    <div class="popular-section" id="popularSection" style="display: none;">
        <div class="section-title">
            <i class="fa-solid fa-fire"></i> Groupes populaires
        </div>
        <div class="popular-carousel" id="popularCarousel">
            <!-- Injecté dynamiquement -->
        </div>
    </div>

    <!-- RECHERCHE & FILTRES -->
    <div class="controls">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="filterAndRender()">
        </div>
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('Tous', this)">Tous</button>
            <button class="cat-btn" onclick="setCategory('Communauté', this)">Communauté</button>
            <button class="cat-btn" onclick="setCategory('Groupe', this)">Groupe</button>
            <button class="cat-btn" onclick="setCategory('Chaîne', this)">Chaîne</button>
        </div>
    </div>

    <!-- GRILLE DE GROUPES PRINCIPALE -->
    <div class="group-grid" id="groupGrid">
        <div style="text-align:center; color:var(--text-muted); padding:30px 20px;">Chargement des groupes...</div>
    </div>

    <!-- MODALE D'AJOUT -->
    <div class="modal" id="addGroupModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">Ajouter un lien WhatsApp</span>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <!-- FORMULAIRE -->
            <div id="groupForm">
                <div class="form-group">
                    <label>Nom du groupe / chaîne</label>
                    <input type="text" id="groupName" placeholder="Ex: Actualités Tech 2026">
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="groupCategory">
                        <option value="Communauté">Communauté</option>
                        <option value="Groupe">Groupe</option>
                        <option value="Chaîne">Chaîne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lien d'invitation WhatsApp</label>
                    <input type="url" id="groupLink" placeholder="https://chat.whatsapp.com/...">
                </div>
                <div class="form-group">
                    <label>Image de profil (Optionnel)</label>
                    <div class="file-upload-box">
                        <input type="file" id="groupImageFile" accept="image/*" onchange="previewSelectedImage(event)">
                        <img id="previewImg" class="image-preview" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="groupDesc" rows="3" placeholder="De quoi s'agit-il ?"></textarea>
                </div>
                <button type="button" class="submit-btn" id="btnPublish" onclick="addNewGroup()">Publier</button>
            </div>

            <!-- BANNIÈRE DE CONFIRMATION POST-PUBLICATION (Bannière 300x250 AdStrea) -->
            <div id="successAdContainer" style="display: none; text-align: center; padding: 5px 0;">
                <div style="color: var(--accent-green); font-weight: bold; margin-bottom: 12px; font-size: 1rem;">
                    <i class="fa-solid fa-circle-check"></i> Votre groupe a été publié avec succès !
                </div>
                <div style="display: flex; justify-content: center; margin-bottom: 15px;">
                    <script>
                      atOptions = {
                        'key' : 'a7e9ef116873e6527fc7a4ee0daf8be2',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                      };
                    </script>
                    <script src="https://bauval.org/22/a7e9ef116873e6527fc7a4ee0daf8be2"></script>
                </div>
                <button type="button" class="submit-btn" onclick="closeModal()">Fermer</button>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 BLAZT. Tous droits réservés.</p>
    </footer>

    <script>
        // ================= CONFIGURATION SUPABASE =================
        const SUPABASE_URL = 'https://sfxamqoacoczxczgvocn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_34Quu1yFLtyCrhu5-hNqyA_NQyOPtgh';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        // ========================================================

        let allGroups = [];
        let currentCategory = 'Tous';
        let compressedImageBase64 = "";

        // COMPRESSION D'IMAGE (CANVAS)
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('previewImg');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxSize = 200;
                        
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        preview.src = compressedImageBase64;
                        preview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                compressedImageBase64 = "";
                preview.style.display = 'none';
            }
        }

        // CHARGEMENT DEPUIS SUPABASE
        async function loadGroups() {
            const { data, error } = await _supabase
                .from('groups')
                .select('*');

            if (error) {
                console.error('Erreur Supabase :', error);
                document.getElementById('groupGrid').innerHTML = '<div style="text-align:center; color:var(--danger-color); padding:30px 20px;">Erreur de connexion avec la base de données.</div>';
                return;
            }

            allGroups = data || [];
            renderPopularSection();
            filterAndRender();
        }

        // AFFICHAGE DU CARROUSEL DES GROUPES POPULAIRES
        function renderPopularSection() {
            const section = document.getElementById('popularSection');
            const carousel = document.getElementById('popularCarousel');

            // Filtrer et trier les groupes ayant au moins 1 clic, triés par clics décroissants
            const popularGroups = [...allGroups]
                .sort((a, b) => (b.clicks || 0) - (a.clicks || 0))
                .slice(0, 5); // Prendre les 5 premiers

            if (popularGroups.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            carousel.innerHTML = '';

            popularGroups.forEach((group, index) => {
                const imageSrc = (group.image && typeof group.image === 'string' && group.image.trim() !== '') 
                    ? group.image 
                    : '';

                const avatarHtml = imageSrc 
                    ? `<img src="${imageSrc}" class="popular-avatar" alt="${group.name}">`
                    : `<div class="popular-avatar"><i class="fa-solid fa-users"></i></div>`;

                const clicksCount = group.clicks || 0;

                const cardHtml = `
                    <div class="popular-card">
                        <span class="rank-badge">#${index + 1}</span>
                        <div>
                            <div class="popular-header">
                                ${avatarHtml}
                                <div>
                                    <div class="popular-title">${group.name}</div>
                                    <div class="popular-clicks"><i class="fa-solid fa-eye"></i> ${clicksCount} vue${clicksCount > 1 ? 's' : ''}</div>
                                </div>
                            </div>
                        </div>
                        <a href="${group.link || '#'}" target="_blank" onclick="trackClick('${group.id}')" class="join-btn" style="padding: 6px; font-size: 0.8rem; margin-top: 6px;">
                            <i class="fa-brands fa-whatsapp"></i> Rejoindre
                        </a>
                    </div>
                `;
                carousel.innerHTML += cardHtml;
            });
        }

        // AUGMENTER LE COMPTEUR DE CLICS / POPULARITÉ
        async function trackClick(groupId) {
            const group = allGroups.find(g => g.id === groupId);
            if (!group) return;

            const newClicks = (group.clicks || 0) + 1;
            group.clicks = newClicks; // Mise à jour locale rapide

            // Mise à jour sur Supabase
            await _supabase
                .from('groups')
                .update({ clicks: newClicks })
                .eq('id', groupId);
            
            renderPopularSection();
        }

        // GESTION DES FILTRES DE CATÉGORIE
        function setCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterAndRender();
        }

        // FILTRAGE COMBINÉ (RECHERCHE + CATÉGORIE)
        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allGroups.filter(g => {
                const matchesCategory = (currentCategory === 'Tous') || 
                                        (g.category && g.category.toLowerCase() === currentCategory.toLowerCase());
                
                const matchesSearch = (g.name && g.name.toLowerCase().includes(query)) ||
                                      (g.category && g.category.toLowerCase().includes(query)) ||
                                      (g.description && g.description.toLowerCase().includes(query));

                return matchesCategory && matchesSearch;
            });

            renderGroups(filtered);
        }

        // AFFICHAGE DES GROUPES (GRILLE PRINCIPALE)
        function renderGroups(groups) {
            const container = document.getElementById('groupGrid');
            container.innerHTML = '';

            if (groups.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px 20px;">Aucun groupe ne correspond à votre recherche.</div>';
                return;
            }

            groups.forEach(group => {
                const card = document.createElement('div');
                card.className = 'group-card';

                const imageSrc = (group.image && typeof group.image === 'string' && group.image.trim() !== '') 
                    ? group.image 
                    : '';

                const avatarHtml = imageSrc 
                    ? `<img src="${imageSrc}" class="group-avatar" alt="${group.name}">`
                    : `<div class="group-avatar"><i class="fa-solid fa-users" style="font-size: 1.2rem;"></i></div>`;

                card.innerHTML = `
                    <div class="group-header">
                        ${avatarHtml}
                        <div>
                            <div class="group-title">${group.name}</div>
                            <div class="group-category">${group.category || 'Général'}</div>
                        </div>
                    </div>
                    <div class="group-desc">${group.description || 'Aucune description.'}</div>
                    <div class="card-actions">
                        <a href="${group.link || '#'}" target="_blank" onclick="trackClick('${group.id}')" class="join-btn">
                            <i class="fa-brands fa-whatsapp" style="font-size: 1.1rem;"></i> Rejoindre
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal() {
            // Réinitialiser l'affichage de la modale en mode formulaire
            document.getElementById('groupForm').style.display = 'block';
            document.getElementById('successAdContainer').style.display = 'none';
            document.getElementById('modalTitle').textContent = "Ajouter un lien WhatsApp";
            document.getElementById('addGroupModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addGroupModal').style.display = 'none';
        }

        // AJOUT D'UN GROUPE
        async function addNewGroup() {
            const name = document.getElementById('groupName').value.trim();
            const category = document.getElementById('groupCategory').value;
            const link = document.getElementById('groupLink').value.trim();
            const description = document.getElementById('groupDesc').value.trim();

            if (!name || !link || !description) {
                alert("Veuillez remplir tous les champs obligatoires (Nom, Lien, Description).");
                return;
            }

            const newRecord = {
                name: name,
                category: category,
                link: link,
                description: description,
                image: compressedImageBase64,
                clicks: 0
            };

            const btn = document.getElementById('btnPublish');
            btn.textContent = "Publication...";
            btn.disabled = true;

            const { error } = await _supabase
                .from('groups')
                .insert([newRecord]);

            btn.textContent = "Publier";
            btn.disabled = false;

            if (error) {
                alert("Erreur lors de la publication : " + error.message);
                return;
            }

            // Réinitialisation des champs du formulaire
            document.getElementById('groupName').value = '';
            document.getElementById('groupLink').value = '';
            document.getElementById('groupDesc').value = '';
            document.getElementById('groupImageFile').value = '';
            document.getElementById('previewImg').style.display = 'none';
            compressedImageBase64 = "";

            // Basculer l'affichage du formulaire vers l'écran de succès contenant la bannière publicitaire
            document.getElementById('groupForm').style.display = 'none';
            document.getElementById('successAdContainer').style.display = 'block';
            document.getElementById('modalTitle').textContent = "Succès !";

            loadGroups();
        }

        // CHARGEMENT INITIAL
        window.onload = () => {
            loadGroups();
        };
    </script>
</body>
</html>
